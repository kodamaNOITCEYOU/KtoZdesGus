
name: Build Goose APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'KtoZdesGus_Android_Project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q KtoZdesGus_Android_Project.zip
          cd KtoZdesGus
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/ru/ktozdesgus/app/MainActivity.kt")
          s = p.read_text()
          s = s.replace(
              '"Верно! $${playerNames[goose]} был гусём 🪿".replace("$", "")',
              '"Верно! ${playerNames[goose]} был гусём 🪿"'
          )
          p.write_text(s)
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd KtoZdesGus
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KtoZdesGus-APK
          path: KtoZdesGus/app/build/outputs/apk/debug/app-debug.apk
