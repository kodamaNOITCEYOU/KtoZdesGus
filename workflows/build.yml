
name: Build Goose APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'KtoZdesGus_Android_Project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q KtoZdesGus_Android_Project.zip
          cd KtoZdesGus
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/ru/ktozdesgus/app/MainActivity.kt")
          s = p.read_text()
          s = s.replace(
              '"Верно! $${playerNames[goose]} был гусём 🪿".replace("$", "")',
              '"Верно! ${playerNames[goose]} был гусём 🪿"'
          )
          p.write_text(s)
          PY

      - name: Build APK
        uses: android-actions/setup-android@v3
      - name: Compile
        run: |
          cd KtoZdesGus
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KtoZdesGus-APK
          path: KtoZdesGus/app/build/outputs/apk/debug/app-debug.apk
